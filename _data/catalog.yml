# Everything the Flisk org builds. One entry per link: name, url, text (one plain sentence).
# bar: the shared top bar (assets/bar.js) that every Flisk site loads. `first` is the flagship, shown first and highlighted;
#   each menu lists item names from the sections below, most important and most widely usable first.
# icon: a file in assets/icons (the same files live in flisk-sh/flisk-emoji, apps/ for products and kinds/ for the generic ones).
# List a product's own site only if it answers; otherwise link its repo.
bar:
  first: Chat
  first_label: AI chat
  menus:
    - label: AI cloud
      items: [Fleet, Flisk Inference, Host, Flisk Bot]
    - label: AI growth
      items: [Grow, Ranker, Cilytics, Flisk Analytics, Citable, README Score, Flisk Jobs, Flisk Traces]
    - label: AI locally
      items: [Flisk CLI, FliskOS, Run My Agents]
    - label: AI learn
      items: [Practice & Learn AI, DevEx Roadmap, Command Comparer, Personal Demos]
    - label: AI tools
      items: [Pages, Citable, README Score, Gardener, README Diagram, Flisk Tools]

sections:
  - id: chat
    title: Chat
    text: Ask in plain words. Flisk does the work on a computer and gives you a link.
    items:
      - name: Chat
        url: https://chat.flisk.si
        icon: chat
        text: Ask for a website, a video or an answer. Sign in with GitHub, free.

  - id: run
    title: Run your app
    text: Start, check and fix a whole app on your own machine.
    items:
      - name: Flisk CLI
        url: https://flisk.sh
        icon: flisk-cli
        text: Run your whole app on your laptop with one command. Your AI can start, check and fix it.
      - name: FliskOS
        url: https://os.flisk.si
        icon: fliskos
        text: Your projects, coding agents and Flisk apps in one local window.
      - name: Run My Agents
        url: https://run-my-agents.flisk.si/
        icon: run-my-agents
        text: Claude Code, simplified. No server, no keys.
      - name: Flisk Import
        url: https://github.com/flisk-sh/flisk-import
        icon: flisk-import
        text: Scan a repo and import its Procfile, Compose and Dockerfile services.
      - name: Flisk Export
        url: https://github.com/flisk-sh/flisk-export
        icon: flisk-export
        text: Write render.yaml and wrangler.toml from your service files. It never deploys.
      - name: Live Preview
        url: https://github.com/flisk-sh/live-preview
        icon: live-preview
        text: Share an app running on your GitHub as a public link.
      - name: cfworker2browser
        url: https://github.com/flisk-sh/cfworker2browser
        icon: cfworker2browser
        text: Run a Cloudflare Worker in the visitor's browser tab. No server, no account.

  - id: publish
    title: Publish and get found
    text: Put a page online and check how people and AI find it.
    items:
      - name: Grow
        url: https://grow.flisk.si
        icon: grow
        text: Paste a link to what you made. Get who would buy it, where they are, and emails and posts to send.
      - name: Pages
        url: https://pages.flisk.si
        icon: put-my-page-online
        text: Your AI builds a page. One command puts it online.
      - name: Citable
        url: https://citable.flisk.si
        icon: citable
        text: Find out if AI answers can cite your site.
      - name: README Score
        url: https://readme.flisk.si
        icon: readme-checker
        text: Your README scored out of 100, with a fix for every miss.
      - name: Ranker
        url: https://ranker.flisk.si
        icon: ranker
        text: Products ranked by stars gained on GitHub, each with a live README badge.
      - name: Cilytics
        url: https://cilytics.flisk.si
        icon: cilytics
        text: See which CI runs are red, slow or flaky across every repo of a GitHub org.
      - name: README Diagram
        url: https://diagram.flisk.si
        icon: readme-diagram
        text: Turn any README into an animated SVG diagram.
      - name: Gardener
        url: https://gardener.flisk.si
        icon: gardener
        text: Grow a dependency tower meme from any GitHub repo.
      - name: Helpdock
        url: https://helpdock.flisk.si
        icon: helpdock
        text: Paused until 1 December. Your docs as a help center that answers with sources.
      - name: Flisk Analytics
        url: https://analytics.flisk.si
        icon: flisk-analytics
        text: See who visits your site. No cookies and no banner.
      - name: Flisk Tools
        url: https://tools.flisk.si/
        icon: flisk-tools
        text: Run small web and GitHub tools on your own GitHub, free.

  - id: ai
    title: AI and models
    text: Free AI models, places to run AI helpers, and a jobs board for them.
    items:
      - name: Build Me an App
        url: https://build.flisk.si/
        icon: build-me-an-app
        text: Say what you want. Get the parts and the commands to run it.
      - name: Flisk Inference
        url: https://inference.flisk.si
        icon: flisk-inference
        text: A free AI model for your apps. Get a key in one minute, no card.
      - name: Fleet
        url: https://fleet.flisk.si
        icon: fleet
        text: Safe, cheap places to run AI agents, with one key and one balance.
      - name: Host
        url: https://host.flisk.si
        icon: host
        text: Free places to run your AI agent, and a 4-step guide to set it up.
      - name: Flisk Jobs
        url: https://jobs.flisk.si
        icon: jobs
        text: "A public jobs board for AI helpers: post a job, one picks it up, and you see every step."
      - name: Flisk Traces
        url: https://traces.flisk.si
        icon: traces
        text: "Only the problems of Flisk's backends: errors, wrong routes, slow calls. Nothing is logged when all is well."
      - name: Flisk Bot
        url: https://bot.flisk.si
        icon: bot
        text: An AI helper that takes jobs from the board and keeps going after a restart.
      - name: Flisk Model
        url: https://github.com/flisk-sh/flisk-model
        icon: flisk-model
        text: Can a small model write correct Flisk config? A 62-question test with results.
      - name: Awesome Model Training
        url: https://github.com/flisk-sh/awesome-model-training
        icon: awesome
        text: Free, open tools for training small specialist models.
      - name: Flisk Agent Stack
        url: https://github.com/flisk-sh/flisk-agent-stack
        icon: stack
        text: A ready-made starter: an AI helper with tools, a database and messages.

  - id: agents
    title: MCP servers, plugins and skills
    text: Add Flisk to Claude, Claude Code, Cursor, Codex or Gemini CLI.
    items:
      - name: Build Me an App MCP
        url: https://build.flisk.si/mcp
        icon: build-me-an-app
        text: Plans an app from a plain description. Remote, read-only, no key.
      - name: Pages MCP
        url: https://pages.flisk.si/mcp
        icon: put-my-page-online
        text: Checks a page and gives the steps to publish it.
      - name: Citable MCP
        url: https://citable.flisk.si/mcp
        icon: citable
        text: Checks whether AI search can find, read and cite a site.
      - name: README Score MCP
        url: https://readme.flisk.si/mcp
        icon: readme-checker
        text: Scores a README and lists a fix for each miss.
      - name: Helpdock MCP
        url: https://helpdock.flisk.si/mcp
        icon: helpdock
        text: Paused until 1 December. Searches the Flisk docs and answers with sources.
      - name: Flisk CLI plugin
        url: https://github.com/flisk-sh/flisk/tree/main/plugins/flisk-claude
        icon: flisk-cli
        text: Use Flisk from inside Claude Code.
      - name: Pages plugin
        url: https://github.com/flisk-sh/pages/tree/main/plugins/put-my-page-online
        icon: put-my-page-online
        text: Publish a page from Claude with one skill.
      - name: Citable plugin
        url: https://github.com/flisk-sh/citable/tree/main/plugins/ai-search-checker
        icon: citable
        text: Check a site for AI search from Claude.
      - name: README Score plugin
        url: https://github.com/flisk-sh/readme-score/tree/main/plugins/readme-checker
        icon: readme-checker
        text: Improve a README from Claude.
      - name: Shunt plugin
        url: https://github.com/flisk-sh/flisk-marketplaces/tree/main/plugins/shunt
        icon: plugin
        text: Saves money by letting a small local AI read big files for you.
      - name: Flisk Skills
        url: https://github.com/flisk-sh/flisk-skills
        icon: skills
        text: Teaches your AI how to set up a Flisk app.
      - name: Flisk Marketplaces
        url: https://github.com/flisk-sh/flisk-marketplaces
        icon: plugin
        text: Where every Flisk app is listed, and how to install each server.

  - id: learn
    title: Compare and learn
    text: Maps, comparisons, lessons and demos.
    items:
      - name: DevEx Roadmap
        url: https://roadmap.flisk.si
        icon: devex-roadmap
        text: A community-edited map of local developer tools.
      - name: Command Comparer
        url: https://cmd.flisk.si
        icon: command-comparer
        text: Flisk commands next to Terraform, Compose, Tilt and more.
      - name: Personal Demos
        url: https://demo.flisk.si
        icon: personal-demos
        text: A demo stack generated just for you.
      - name: Practice & Learn AI
        url: https://practice.flisk.si/
        icon: learn-ai
        text: A free course of 26 hands-on labs, from a first model call to a shipped assistant.
      - name: Flisk Learn
        url: https://learn.flisk.si
        icon: learn-ai
        text: Learn, practice and take an exam on AI engineering, with hands-on labs.
      - name: Demo animation
        url: https://flisk-sh.github.io/flisk-demo-animation/
        icon: personal-demos
        text: A recorded walkthrough from install to a healthy service.
      - name: Comparer
        url: https://flisk-sh.github.io/comparer/
        icon: command-comparer
        text: A template for a searchable side-by-side comparison of tool commands.
      - name: Awesome Flisk
        url: https://github.com/flisk-sh/awesome-flisk-framework
        icon: awesome
        text: Curated links for Flisk CLI examples and docs.
      - name: Rebuild cases
        url: https://github.com/flisk-sh/awesome-rea-flisk-cases
        icon: awesome
        text: Apps reverse-engineered and rebuilt with the Flisk CLI.

  - id: templates
    title: Templates and starters
    text: Start a new project from something that already runs.
    items:
      - name: Launch template
        url: https://github.com/flisk-sh/flisk-template-launch
