  - id: install
    title: Install and extras
    text: Ways to get the CLI, and small things we made along the way.
    items:
      - name: npm package
        url: https://www.npmjs.com/package/@flisk-sh/flisk
        icon: package
        text: The Flisk CLI on npm.
      - name: Homebrew tap
        url: https://github.com/flisk-sh/homebrew-tap
        icon: package
        text: Install the CLI with Homebrew on macOS and Linux.
      - name: Scoop bucket
        url: https://github.com/flisk-sh/scoop-bucket
        icon: package
        text: Install the CLI with Scoop on Windows.
      - name: Binaries
        url: https://github.com/flisk-sh/releases
        icon: download
        text: Prebuilt CLI binaries for Linux and macOS, with checksums.
      - name: Flisk emoji
        url: https://github.com/flisk-sh/flisk-emoji
        icon: emoji
        text: The Flisk bolt as a custom emoji, in SVG and PNG.
      - name: md2html
        url: https://github.com/flisk-sh/md2html
        icon: doc
        text: GitHub-flavored Markdown to HTML that is safe to put in a page.
      - name: Starlark checks
        url: https://github.com/flisk-sh/codeql-starlark
        icon: checks
        text: Unofficial Starlark checks that report to GitHub code scanning.
      - name: Goose checks
        url: https://github.com/flisk-sh/codeql-goose
        icon: checks
        text: Unofficial Goose checks that report to GitHub code scanning.
      - name: Lobster checks
        url: https://github.com/flisk-sh/codeql-lobster
        icon: checks
        text: Unofficial Lobster checks that report to GitHub code scanning.
