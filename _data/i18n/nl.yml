sections:
  chat: {title: Chat, text: Vraag het in gewone woorden. Flisk doet het werk op een computer en geeft je een link.}
  run: {title: Draai je app, text: Start, controleer en repareer een hele app op je eigen computer.}
  publish: {title: Publiceren en gevonden worden, text: Zet een pagina online en kijk hoe mensen en AI hem vinden.}
  ai: {title: AI en modellen, text: "Gratis AI-modellen, plekken om AI-helpers te draaien en een klussenbord voor ze."}
  agents: {title: MCP-servers, plugins en skills, text: "Voeg Flisk toe aan Claude, Claude Code, Cursor, Codex of Gemini CLI."}
  learn: {title: Vergelijken en leren, text: "Kaarten, vergelijkingen, lessen en demo's."}
  templates: {title: Sjablonen en starters, text: Begin een nieuw project met iets dat al draait.}
