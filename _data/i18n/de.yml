sections:
  chat: {title: Chat, text: Frag in einfachen Worten. Flisk erledigt die Arbeit auf einem Computer und gibt dir einen Link.}
  run: {title: Deine App ausführen, text: Starte, prüfe und repariere eine ganze App auf deinem eigenen Rechner.}
  publish: {title: Veröffentlichen und gefunden werden, text: Stell eine Seite online und prüfe, wie Menschen und KI sie finden.}
  ai: {title: KI und Modelle, text: "Kostenlose KI-Modelle, Orte für KI-Helfer und eine Jobbörse für sie."}
