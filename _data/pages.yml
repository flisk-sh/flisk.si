cmd.flisk.si:
  name: Command Comparer
  pages:
  - title: About | Command Comparer
    url: https://cmd.flisk.si/about/
    text: Side-by-side commands for Flisk, Terraform, AWS CDK, Docker Compose, Tilt,
      Skaffold, Garden, PM2 and more, across 16 tabs, with a source link for every
      cell.
  - title: Pick tools | Command Comparer
    url: https://cmd.flisk.si/pick/
    text: Side-by-side commands for Flisk, Terraform, AWS CDK, Docker Compose, Tilt,
      Skaffold, Garden, PM2 and more, across 16 tabs, with a source link for every
      cell.
  - title: 'Command Comparer: Flisk commands next to Terraform, Compose, Tilt and
      more'
    url: https://cmd.flisk.si/
    text: Flisk next to the usual tools. Terraform and CDK provision infrastructure.
      Flisk only runs your app locally. Every command has a source link.
  - title: Flisk vs Terraform, OpenTofu, Pulumi, CDK and CloudFormation | Command
      Comparer
    url: https://cmd.flisk.si/iac/
    text: Flisk vs Terraform, OpenTofu, Pulumi, CDK and CloudFormation. These provision
      cloud infrastructure. Flisk runs your app locally and never provisions. Every
      command has a source link.
  - title: Flisk vs Docker Compose and Tilt | Command Comparer
    url: https://cmd.flisk.si/compose-tilt/
    text: Flisk vs Docker Compose and Tilt. Flisk generates a Compose file and a Tiltfile
      and runs them for you. Every command has a source link.
  - title: Flisk vs process-compose, Overmind and PM2 | Command Comparer
    url: https://cmd.flisk.si/process-runners/
    text: Flisk vs process-compose, Overmind and PM2. With a command in every service.json,
      Flisk runs plain processes without Docker. Every command has a source link.
  - title: Flisk vs Skaffold, DevSpace and Garden | Command Comparer
    url: https://cmd.flisk.si/kubernetes-dev/
    text: Flisk vs Skaffold, DevSpace and Garden. These work against a cluster and
      deploy. Flisk is local only and never deploys. Every command has a source link.
  - title: Flisk vs kind and minikube | Command Comparer
    url: https://cmd.flisk.si/local-kubernetes/
    text: Flisk vs kind and minikube. kind and minikube run real Kubernetes on your
      laptop. Flisk does not. Every command has a source link.
  - title: Flisk vs Telepresence and mirrord | Command Comparer
    url: https://cmd.flisk.si/cluster-bridges/
    text: Flisk vs Telepresence and mirrord. These connect your laptop to a remote
      cluster. Flisk needs no cluster. Every command has a source link.
  - title: Flisk vs Dev Containers and Devbox | Command Comparer
    url: https://cmd.flisk.si/dev-environments/
    text: Flisk vs Dev Containers and Devbox. These install your toolchain. Flisk
      runs your services and only checks the tools. Every command has a source link.
  - title: Flisk vs GitHub Codespaces and Coder | Command Comparer
    url: https://cmd.flisk.si/cloud-workspaces/
    text: Flisk vs GitHub Codespaces and Coder. These give you a remote machine. You
      can run flisk up inside one. Every command has a source link.
  - title: Flisk vs Nx and Turborepo | Command Comparer
    url: https://cmd.flisk.si/monorepo-tools/
    text: Flisk vs Nx and Turborepo. Nx and Turborepo run and cache builds. Flisk
      caches nothing. Every command has a source link.
  - title: Flisk vs .NET Aspire and Encore | Command Comparer
    url: https://cmd.flisk.si/app-frameworks/
    text: Flisk vs .NET Aspire and Encore. Aspire and Encore are frameworks you adopt.
      Flisk needs no code changes. Every command has a source link.
  - title: Flisk vs LocalStack, Supabase CLI and Firebase emulators | Command Comparer
    url: https://cmd.flisk.si/local-services/
    text: Flisk vs LocalStack, Supabase CLI and Firebase emulators. These emulate
      cloud services locally. Flisk starts Postgres, NATS and Traefik beside your
      app. Every command has a source link.
  - title: Flisk vs Prisma, Drizzle, Atlas and dbmate | Command Comparer
    url: https://cmd.flisk.si/databases/
    text: Flisk vs Prisma, Drizzle, Atlas and dbmate. These define and run migrations.
      Flisk runs them in a migrator resource before the API starts. Every command
      has a source link.
  - title: Flisk vs LangGraph and Mastra | Command Comparer
    url: https://cmd.flisk.si/ai-agents/
    text: Flisk vs LangGraph and Mastra. LangGraph and Mastra build the agent. Flisk
      runs it next to its tools and database. Every command has a source link.
  - title: Flisk vs Warp, Superset, skills.sh and Coder | Command Comparer
    url: https://cmd.flisk.si/agent-tools/
    text: Flisk vs Warp, Superset, skills.sh and Coder. These help coding agents work.
      Flisk runs the stack the agent works on. Every command has a source link.
  - title: Flisk vs Claude Code, Codex, Cursor and Gemini CLI | Command Comparer
    url: https://cmd.flisk.si/coding-agents/
    text: Flisk vs Claude Code, Codex, Cursor and Gemini CLI. These are the agents.
      Flisk gives them a stack to run and an MCP server to call. Every command has
      a source link.
demo.flisk.si:
  name: Personal Demos
  pages:
  - title: 'Personal Demos: reply grok bubbles, get a local stack'
    url: https://demo.flisk.si/
    text: 'Reply to any X post with grok bubbles and get a link to a running local
      stack: real service.json files, a repo built in CI, and a live run you can clone.'
  - title: How grok bubbles works, without AI
    url: https://demo.flisk.si/how-it-works
    text: Grok only triggers it. A plain program turns the link into service.json
      files, a repo built in CI and a stack that runs live. Here is every step, and
      where it stops.
practice.flisk.si:
  name: Practice & Learn AI
  pages:
  - title: Survive a restart, wait for a person | Practice & Learn AI
    url: https://practice.flisk.si/labs/43-durable/
    text: Build a claim flow that saves its place after every step, pauses for a human
      on large amounts, and pays exactly once.
  - title: Is Flisk installed? | Practice & Learn AI
    url: https://practice.flisk.si/labs/01-installed/
    text: Check that the Flisk CLI is on your PATH and that your machine can run a
      local stack.
  - title: A model plus a harness | Practice & Learn AI
    url: https://practice.flisk.si/labs/30-harness/
    text: 'Wrap your tool loop in the parts that make it usable: instructions in a
      file, a permission question, a budget and a log.'
  - title: Call a hosted model and read the bill | Practice & Learn AI
    url: https://practice.flisk.si/labs/11-chat-api/
    text: Send a chat request to a hosted model from your own script, keep a conversation
      going, and print what each call costs.
  - title: Memory that outlives the conversation | Practice & Learn AI
    url: https://practice.flisk.si/labs/42-memory/
    text: Let your assistant store facts and find them in a later session, without
      one customer seeing another’s.
  - title: Scaffold a project | Practice & Learn AI
    url: https://practice.flisk.si/labs/02-scaffold/
    text: Create a new Flisk project in an empty folder.
  - title: Build a tool server any assistant can use | Practice & Learn AI
    url: https://practice.flisk.si/labs/32-mcp-server/
    text: Publish your tools over the Model Context Protocol so any assistant that
      speaks it can call them.
  - title: Get data back, not prose | Practice & Learn AI
    url: https://practice.flisk.si/labs/14-structured-output/
    text: Turn messy customer emails into validated records your code can trust.
  - title: Many workers, one dispatcher | Practice & Learn AI
    url: https://practice.flisk.si/labs/44-fan-out/
    text: Process a batch of claims in parallel with a cap on how many run at once,
      retries for the ones that fail, and no claim lost.
  - title: Answer from your documents, with sources | Practice & Learn AI
    url: https://practice.flisk.si/labs/21-rag/
    text: Build a question answerer that reads your own documents, names the file
      each answer came from, and says so when the answer is not there.
  - title: Make AI-written code safe to merge | Practice & Learn AI
    url: https://practice.flisk.si/labs/33-hardening/
    text: 'Set up the checks that catch a coding agent’s mistakes before a person
      has to: lint, types, tests with a coverage floor, and a commit hook.'
  - title: Build a dataset and a baseline to beat | Practice & Learn AI
    url: https://practice.flisk.si/labs/23-dataset-baseline/
    text: Make a small labelled dataset and score two cheap baselines on it, so later
      work has a number to beat.
  - title: One door for every tool, with rules | Practice & Learn AI
    url: https://practice.flisk.si/labs/52-gateway-policy/
    text: Put every tool call through one checkpoint that decides allow, deny or ask
      a person, from rules kept in a file.
  - title: Search by meaning | Practice & Learn AI
    url: https://practice.flisk.si/labs/20-embeddings/
    text: Turn text into vectors and find the closest sentences, first in memory and
      then in a database.
  - title: Attack your own assistant | Practice & Learn AI
    url: https://practice.flisk.si/labs/51-security/
    text: Break your assistant with instructions hidden in the content it reads, then
      close the hole in the design rather than in the prompt.
  - title: Pick a model with numbers | Practice & Learn AI
    url: https://practice.flisk.si/labs/12-compare-models/
    text: Run the same five tasks on three models and choose one from a table of speed,
      cost and quality.
  - title: Put a coding agent on rails | Practice & Learn AI
    url: https://practice.flisk.si/labs/31-coding-agent-rules/
    text: Write the instruction file a coding agent reads, and use permission modes
      so it plans before it edits.
  - title: Grade with a judge you have checked | Practice & Learn AI
    url: https://practice.flisk.si/labs/40-evals-judge/
    text: Use a model to grade answers, and prove first that it grades the way you
      do.
  - title: 'Capstone: the claims desk | Practice & Learn AI'
    url: https://practice.flisk.si/labs/54-capstone/
    text: Put the course together into one assistant for Parcel Desk and hand it to
      someone else to run.
  - title: Choose and run open models | Practice & Learn AI
    url: https://practice.flisk.si/labs/34-open-weights/
    text: Measure what a smaller, more compressed copy of a model costs you in quality
      and gives you in speed and memory.
  - title: Fine-tune a small open model | Practice & Learn AI
    url: https://practice.flisk.si/labs/24-fine-tune/
    text: Train a small adapter (LoRA) on your dataset and prove with the test rows
      whether it beat the baselines.
  - title: 'See every step: traces | Practice & Learn AI'
    url: https://practice.flisk.si/labs/41-tracing/
    text: Record every model call and tool call of a run so you can see where the
      time and money went.
  - title: 'Give a model tools: the loop from scratch | Practice & Learn AI'
    url: https://practice.flisk.si/labs/13-tool-loop/
    text: Write the loop that lets a model call your functions, with no framework,
      so you know what every framework is doing for you.
  - title: Ship it and know the bill | Practice & Learn AI
    url: https://practice.flisk.si/labs/53-deploy/
    text: Package your assistant so it runs the same anywhere, keep secrets out of
      the package, and work out what a request costs.
  - title: Let it improve itself, and prove it | Practice & Learn AI
    url: https://practice.flisk.si/labs/45-self-improve/
    text: Have a model propose changes to your prompt from its own failures, and accept
      a change only when held-back data says it helped.
  - title: Measure retrieval before you tune it | Practice & Learn AI
    url: https://practice.flisk.si/labs/22-rag-evals/
    text: Put a number on how often the right page is found, then change one thing
      and see if the number moves.
  - title: Run a model on your laptop | Practice & Learn AI
    url: https://practice.flisk.si/labs/10-local-model/
    text: 'Run a small open model on your own machine and call it two ways: from the
      terminal and over HTTP.'
  - title: Add a backend resource | Practice & Learn AI
    url: https://practice.flisk.si/labs/03-backend/
    text: Add your first backend service to the project and see Flisk pick it up.
  - title: Find the use case worth building | Practice & Learn AI
    url: https://practice.flisk.si/labs/50-discovery/
    text: Turn a customer’s vague wish for AI into one use case with a number that
      says when it worked.
  - title: Awesome Flisk catalog | Practice & Learn AI
    url: https://practice.flisk.si/catalog/
    text: Browse official, community, and archived Flisk learning resources.
  - title: Practice & Learn AI — hands-on labs, from a first model call to a shipped
      assistant | Practice & Learn AI
    url: https://practice.flisk.si/
    text: Free hands-on labs for building with AI. Run a model, give it tools, measure
      it, make it survive a restart, and ship it to a customer. Each lab ends with
      a check you run yourself.
