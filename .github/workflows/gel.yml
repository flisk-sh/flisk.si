name: GEL
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gel-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gel:
    permissions: { contents: read, checks: read, pull-requests: read }
    uses: flisk-sh/gel/.github/workflows/gel.yml@baf8a9789b7dcd815763a7bdb186186761417cb7 # v1.7.0
    with: { gel_ref: baf8a9789b7dcd815763a7bdb186186761417cb7 }
